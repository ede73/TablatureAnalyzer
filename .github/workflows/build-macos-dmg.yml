name: Build macOS DMG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-macos-dmg.yml"
      - "composeApp/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-daemon

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: TablatureAnalyzer-macOS-${{ matrix.architecture }}-DMG
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
